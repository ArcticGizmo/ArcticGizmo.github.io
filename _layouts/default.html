<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{{ page.title | default: site.title }}</title>
  <meta name="description" content="{{ site.description }}">
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="stylesheet" href="{{ '/assets/css/style.css' | relative_url }}">
</head>
<body>
  <main class="container">
    {{ content }}
  </main>
  <footer class="site-footer container">
    <p>
      Built by <a href="https://github.com/{{ site.github_username }}">{{ site.author }}</a>
    </p>
  </footer>
  <script>
    (function () {
      var dropdowns = document.querySelectorAll('details.dropdown');
      // Close the others when one opens.
      dropdowns.forEach(function (d) {
        d.addEventListener('toggle', function () {
          if (!d.open) return;
          dropdowns.forEach(function (o) { if (o !== d) o.removeAttribute('open'); });
        });
      });
      // Click outside closes any open menu.
      document.addEventListener('click', function (e) {
        dropdowns.forEach(function (d) {
          if (d.open && !d.contains(e.target)) d.removeAttribute('open');
        });
      });
      // Escape closes any open menu.
      document.addEventListener('keydown', function (e) {
        if (e.key !== 'Escape') return;
        dropdowns.forEach(function (d) { d.removeAttribute('open'); });
      });
    })();
  </script>
</body>
</html>
