# ---------------------------------------------------------------------------
# Your tools live here. To add a new one, copy a block below and edit it.
# Everything except `name` and `description` is optional — leave fields out
# and the card simply won't show them.
#
#   name:        Display name of the tool
#   description: One or two sentences. Keep it punchy.
#   logo:        Optional logo shown centered at the top of the card. Either a
#                local path like /assets/img/my-tool.png (drop the file in
#                assets/img/) or a full https:// URL. If omitted, the card shows
#                a lettered badge instead.
#   type:        Free-text badge, e.g. CLI / Library / Desktop App
#   language:    Optional language badge, e.g. Rust, TypeScript, Python
#   install:     Optional one-line install command shown as a code snippet
#   tags:        Optional list of short keywords
#
#   repo:        GitHub "owner/name". Only used to expand bare `downloads` URLs
#                (see below) — omit it if you always give full URLs.
#
#   downloads:   Optional list of { label, url } entries shown in the "Download"
#                dropdown. Put whatever you like here in whatever order. Each
#                `url` is EITHER a full https:// URL, OR a bare release-asset
#                filename which is expanded to that repo's LATEST release:
#                  https://github.com/<repo>/releases/latest/download/<url>
#                (a stable link that always points at the newest release — use
#                this for assets whose name has no version in it).
#
#                downloads:
#                  - label: Windows (.exe)
#                    url: MyApp-win-Setup.exe          # → latest release asset
#                  - label: macOS (.dmg)
#                    url: https://example.com/MyApp.dmg   # → used verbatim
#
#   releasesUrl: Optional. If set, adds a "See all releases →" entry at the
#                bottom of the dropdown pointing here (usually the repo's
#                releases page).
#
#   The Download button only appears when `downloads` has entries OR
#   `releasesUrl` is set. With only `releasesUrl`, the button links straight
#   to it instead of opening a menu.
#
#   links:       Optional list of { label, url } buttons (Repo, Docs, …) shown
#                next to the Download button.
# ---------------------------------------------------------------------------

- name: Perch
  description: Keep an eye on every Claude Code session from one floating panel — get notified, track your usage and add custom notes to each of your sessions so you always know what needs to be done.
  logo: /assets/img/perch.svg
  type: Desktop App
  language: C#
  tags: [windows, macos, claude-code, tray]
  repo: ArcticGizmo/perch
  downloads:
    - label: Windows (.exe)
      url: Perch-win-Setup.exe
    - label: macOS (.pkg)
      url: Perch-osx-Setup.pkg
    - label: macOS (.dmg)
      url: Perch-osx-arm64.dmg
  releasesUrl: https://github.com/ArcticGizmo/perch/releases/latest
  links:
    - label: Repo
      url: https://github.com/ArcticGizmo/perch

