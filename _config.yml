# Site settings
title: ArcticGizmo
tagline: Standalone tools & libraries I've built
description: A launchpad for the open-source tools, libraries, and apps I maintain.
author: ArcticGizmo
github_username: ArcticGizmo

# Used to build absolute URLs. For a user page this is your github.io root.
url: "https://arcticgizmo.github.io"
baseurl: ""

# Build settings
markdown: kramdown

# Collections
# Each tool is one file in _tools/. It gets its own page at /tools/<name>/.
collections:
  tools:
    output: true
    permalink: /tools/:name/

# Default layout for every tool page.
defaults:
  - scope:
      path: ""
      type: tools
    values:
      layout: tool

# Files Jekyll should not copy into the built site
exclude:
  - README.md
  - docker-compose.yml
  - vendor
  - .github
  - _tool-template.md
  - docs
